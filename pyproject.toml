[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py310"
extend-exclude = ["build", "install", "log", "output", "docs/_theme"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "N", "PLR0912", "PLR0915"]

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 12

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
